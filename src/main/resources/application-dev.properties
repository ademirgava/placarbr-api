spring.application.name=placarbr-api
server.servlet.context-path=/api

spring.datasource.url=jdbc:mysql://${DATABASE_DEV_URL}/placarbr?createDatabaseIfNotExist=true
spring.datasource.username=${DATABASE_DEV_USERNAME}
spring.datasource.password=${DATABASE_DEV_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

api.security.token.secret=${JWT_SECRET:234567}

